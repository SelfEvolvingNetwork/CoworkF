name = "coworkf"
compatibility_date = "2026-08-04"

# For Cloudflare Workers with Assets (npx wrangler deploy)
assets = { directory = "./dist" }

# For Cloudflare Pages (npx wrangler pages deploy dist)
pages_build_output_dir = "dist"

# Optional: Cloudflare KV Namespace binding for persistent storage
# [[kv_namespaces]]
# binding = "COWORKING_KV"
# id = "YOUR_KV_NAMESPACE_ID"

