name = "coworkf"
main = "src/worker.ts"
compatibility_date = "2026-08-04"

[build]
command = "npm run build"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[[durable_objects.bindings]]
name = "COWORKING_DO"
class_name = "CoworkingDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CoworkingDO"]

# Optional: Cloudflare KV Namespace binding for fallback
# [[kv_namespaces]]
# binding = "COWORKING_KV"
# id = "YOUR_KV_NAMESPACE_ID"

