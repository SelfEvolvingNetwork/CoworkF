name = "coworkf"
main = "src/worker.ts"
compatibility_date = "2026-08-04"

[build]
command = "npm run build"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Cloudflare D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "coworking_d1"
database_id = "COWORKING_D1_ID"

# Optional: Cloudflare KV Namespace binding for persistent storage
# [[kv_namespaces]]
# binding = "COWORKING_KV"
# id = "YOUR_KV_NAMESPACE_ID"

