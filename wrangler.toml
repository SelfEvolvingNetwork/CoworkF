name = "coworkf"
main = "src/worker.ts"
compatibility_date = "2026-08-04"

[build]
command = "npm run build"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Cloudflare D1 Database binding
# To connect D1 in Cloudflare Pages / Workers:
# 1. Run: npx wrangler d1 create coworking_d1
# 2. Paste the generated database_id below OR bind 'DB' in Cloudflare Pages Dashboard
# [[d1_databases]]
# binding = "DB"
# database_name = "coworking_d1"
# database_id = "YOUR_D1_DATABASE_ID"

